name: Release

on:
  release:
    types:
      - created

jobs:
  build:
    runs-on: macos-latest

    steps:

    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Check cache
      id: verify-cache
      run: |
        echo "::set-output name=heads::`git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/xybp888/iOS-SDKs | head -n 1 | cut -f 1`"

    - name: Use cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/theos
        key: ${{ runner.os }}-${{ steps.verify-cache.outputs.heads }}

    - name: Theos Setup (Setup)
      uses: NyaMisty/theos-action@master
      with: 
        theos-src: https://github.com/roothide/theos

    - name: Prepare AltList
      run: |
        git clone https://github.com/opa334/AltList.git
        cd AltList
        chmod +x install_to_theos.sh && ./install_to_theos.sh
        # install_to_theos.sh only installs the framework; the headers must be copied manually.
        # AltList.h goes into $THEOS/include/ and all ATL headers into $THEOS/include/AltList/
        # so that <AltList/AltList.h> and its inner <AltList/ATL*.h> imports resolve.
        mkdir -p $THEOS/include/AltList
        cp AltList.h $THEOS/include/
        cp *.h $THEOS/include/AltList/
        cd ..

    - name: Patch PSSpecifier (idempotent)
      run: |
        grep -q "SEL setter;" $THEOS/vendor/include/Preferences/PSSpecifier.h \
          || sed -i '' 's/SEL action;/SEL action;\n\tSEL setter;\n\tSEL getter;/' $THEOS/vendor/include/Preferences/PSSpecifier.h

    - name: remove old package
      run: |
        rm -rf packages

    - name: Build package - rootless
      run: |
        make clean && THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 make package

    - name: Build package - roothide
      run: |
        make clean && THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 make package

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ github.workspace }}/packages/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}