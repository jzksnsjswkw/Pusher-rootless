name: Release

on:
  release:
    # `published`, not `created`. The `created` action fires when a *draft* is
    # saved; a release made straight to published — which is what `gh release
    # create` does, and what the web form does unless a draft is saved first —
    # only fires `published`. Listening for `created` alone is why the 3.0.0 beta
    # release produced no build.
    types:
      - published
  # So a workflow edit can be tried without cutting a release to try it with.
  # The build runs; the upload step is skipped because there is no tag.
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Check cache
      id: verify-cache
      # `::set-output` was retired in 2023; the replacement is a line on stdout
      # written to the file named by $GITHUB_OUTPUT.
      run: |
        echo "heads=`git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/xybp888/iOS-SDKs | head -n 1 | cut -f 1`" >> $GITHUB_OUTPUT

    - name: Use cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/theos
        key: ${{ runner.os }}-${{ steps.verify-cache.outputs.heads }}

    - name: Theos Setup (Setup)
      uses: NyaMisty/theos-action@master
      with: 
        theos-src: https://github.com/roothide/theos

    - name: Prepare AltList
      run: |
        git clone https://github.com/opa334/AltList.git
        cd AltList
        chmod +x install_to_theos.sh && ./install_to_theos.sh
        # install_to_theos.sh only installs the framework; the headers must be copied manually.
        # AltList.h goes into $THEOS/include/ and all ATL headers into $THEOS/include/AltList/
        # so that <AltList/AltList.h> and its inner <AltList/ATL*.h> imports resolve.
        mkdir -p $THEOS/include/AltList
        cp AltList.h $THEOS/include/
        cp *.h $THEOS/include/AltList/
        # The roothide scheme links frameworks from $THEOS/lib/iphone/roothide, which
        # install_to_theos.sh does not populate; copy the rootless build there.
        mkdir -p $THEOS/lib/iphone/roothide
        cp -R ./.theos/obj/AltList.framework $THEOS/lib/iphone/roothide/
        cd ..

    - name: remove old package
      run: |
        rm -rf packages

    # `<scheme> make clean` rather than `make clean`: the clean target itself
    # depends on the scheme, and cleaning without one leaves the previous
    # scheme's staged files in place.
    - name: Build package - rootless
      run: |
        THEOS_PACKAGE_SCHEME=rootless make clean
        THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 make package

    - name: Build package - roothide
      run: |
        THEOS_PACKAGE_SCHEME=roothide make clean
        THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 make package

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ github.workspace }}/packages/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}