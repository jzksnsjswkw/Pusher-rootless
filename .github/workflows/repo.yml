name: Repository

# Builds the Sileo source from a release's assets and publishes it to Pages.
#
# Runs after the release job rather than inside it: the index lists the two debs
# that release attached, and those are not available until it has finished.
on:
  release:
    types:
      - published
  # Manual runs need the tag explicitly: `github.event.release` does not exist for
  # a dispatch, so the download step would look for a release called "".
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to index (e.g. v3.0.0-beta4)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # One tag either way: from the release event, or from the dispatch input.
      - name: Resolve the tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "no tag — a dispatch must supply one" >&2
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch the release's debs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p staged
          gh release download "${{ steps.tag.outputs.value }}" \
            --pattern '*.deb' --dir staged
          ls -la staged

      - name: Build the index
        run: |
          # dpkg-deb is what reads the control fields, and macOS has no dpkg.
          brew install dpkg
          # `packages/mirrored` is picked up by the script itself: SandyXpc is a
          # runtime dependency whose debs belong in this source, or installing
          # Pusher stops on an unresolved dependency nobody can find.
          ./.github/scripts/make_repo.sh "${{ steps.tag.outputs.value }}" staged/*.deb
          ls -la repo/debs 2>/dev/null || true

      - name: Publish to Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # The source lives in `jzksnsjswkw/repo`, which is what
          # https://jzksnsjswkw.github.io/repo/ serves. Publishing to this
          # repository's own gh-pages would put the index at /Pusher-rootless/
          # instead, and every URL `make_repo.sh` writes points at /repo/ — so the
          # debs, the icons and the package page would all 404.
          #
          # That needs a token with write access to the other repository; the
          # workflow's own token cannot reach it.
          deploy_key: ${{ secrets.REPO_DEPLOY_KEY }}
          external_repository: jzksnsjswkw/repo
          publish_dir: ./repo
          publish_branch: gh-pages
          destination_dir: .
          keep_files: false
